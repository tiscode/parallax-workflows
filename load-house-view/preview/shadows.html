<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation — shadows" subtitle="Stripe-style dual shadow, 5 levels (neutral)" viewport="700x165" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#F5F6F8;padding:30px 24px;font-family:var(--font-body);display:flex;gap:22px;align-items:center;justify-content:space-between}
  .r{display:flex;flex-direction:column;align-items:center;gap:11px}
  .box{width:78px;height:54px;background:#fff;border-radius:8px}
  .nm{font-size:11px;font-weight:600;color:var(--ink)}
  .s1{box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .s2{box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06)}
  .s3{box-shadow:0 4px 6px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06)}
  .s4{box-shadow:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05)}
  .s5{box-shadow:0 20px 25px rgba(0,0,0,.15),0 10px 10px rgba(0,0,0,.04)}
</style></head><body>
<div class="wrap">
  <div class="r"><div class="box s1"></div><div class="nm">1 · Rows</div></div>
  <div class="r"><div class="box s2"></div><div class="nm">2 · Cards</div></div>
  <div class="r"><div class="box s3"></div><div class="nm">3 · Dropdown</div></div>
  <div class="r"><div class="box s4"></div><div class="nm">4 · Modal</div></div>
  <div class="r"><div class="box s5"></div><div class="nm">5 · Palette</div></div>
</div>
</body></html>
