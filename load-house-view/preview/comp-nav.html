<!doctype html>
<!-- @dsCard group="Components" name="Navigation bar" subtitle="Light nav: wordmark, links, orange CTA" viewport="700x115" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#F5F6F8;padding:22px 24px;font-family:var(--font-body)}
  .nav{background:#fff;border:1px solid #e7eaef;border-radius:8px;display:flex;align-items:center;gap:24px;padding:0 18px;height:60px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .mark{display:flex;align-items:center;gap:9px}
  .mark img{width:22px;height:24px}
  .wm{font-family:var(--font-head);font-weight:700;color:#0C2746;font-size:17px;letter-spacing:.01em}
  .links{display:flex;gap:22px;margin-left:14px}
  .links a{font-size:14px;color:#1F2937;text-decoration:none;padding:20px 0}
  .links a.active{color:#0C2746;font-weight:600;border-bottom:2px solid #0C2746}
  .cta{margin-left:auto;background:#ED7D31;color:#fff;border:0;border-radius:6px;padding:9px 16px;font:600 13.5px var(--font-body);cursor:pointer}
</style></head><body>
<div class="wrap">
  <div class="nav">
    <div class="mark"><img src="../assets/parallax-mark-navy.svg" alt=""><span class="wm">Parallax</span></div>
    <div class="links"><a class="active">Features</a><a>Insights</a><a>Technology</a><a>Docs</a></div>
    <button class="cta">Schedule a Demo</button>
  </div>
</div>
</body></html>
