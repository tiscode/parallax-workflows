<!doctype html>
<!-- @dsCard group="Components" name="Form input" subtitle="Default / focus (blue) / error states" viewport="700x150" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#fff;padding:24px 26px;font-family:var(--font-body);display:flex;gap:24px}
  .f{flex:1;display:flex;flex-direction:column;gap:6px}
  label{font-size:12px;font-weight:600;color:#6B7280;letter-spacing:.5px}
  input{font:14px var(--font-body);padding:10px 14px;border-radius:6px;border:1px solid #CCCDCF;background:#fff;color:#1F2937;outline:none}
  .focus input{border:2px solid #2563EB;padding:9px 13px}
  .err input{border:1px solid #B91C1C}
  .help{font-size:12px;color:#B91C1C}
</style></head><body>
<div class="wrap">
  <div class="f"><label>EMAIL</label><input value="analyst@firm.com"></div>
  <div class="f focus"><label>API KEY</label><input value="pk_live_••••••"></div>
  <div class="f err"><label>SEATS</label><input value="0"><span class="help">Must be at least 1.</span></div>
</div>
</body></html>
