<!doctype html>
<!-- @dsCard group="Colors" name="Primary palette" subtitle="Navy anchor, blues, CTA orange, ink" viewport="700x155" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#fff;padding:22px 24px;font-family:var(--font-body);display:flex;gap:14px}
  .sw{flex:1;display:flex;flex-direction:column;gap:8px}
  .chip{height:64px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}
  .nm{font-size:12px;color:var(--ink);font-weight:600;line-height:1.2}
  .hx{font-family:ui-monospace,monospace;font-size:11px;color:var(--label-grey)}
</style></head><body>
<div class="wrap">
  <div class="sw"><div class="chip" style="background:#0C2746"></div><div class="nm">Primary Navy</div><div class="hx">#0C2746</div></div>
  <div class="sw"><div class="chip" style="background:#154175"></div><div class="nm">Secondary Blue</div><div class="hx">#154175</div></div>
  <div class="sw"><div class="chip" style="background:#547498"></div><div class="nm">Accent Blue</div><div class="hx">#547498</div></div>
  <div class="sw"><div class="chip" style="background:#92A6C1"></div><div class="nm">Light Blue</div><div class="hx">#92A6C1</div></div>
  <div class="sw"><div class="chip" style="background:#ED7D31"></div><div class="nm">CTA Orange</div><div class="hx">#ED7D31</div></div>
  <div class="sw"><div class="chip" style="background:#1F2937"></div><div class="nm">Body Text</div><div class="hx">#1F2937</div></div>
  <div class="sw"><div class="chip" style="background:#fff"></div><div class="nm">White</div><div class="hx">#FFFFFF</div></div>
</div>
</body></html>
