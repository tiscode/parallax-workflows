<!doctype html>
<!-- @dsCard group="Colors" name="60-30-10 composition" subtitle="60% neutrals · 30% navy · 10% orange + semantic" viewport="700x150" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#fff;padding:24px 28px;font-family:var(--font-body)}
  .bar{display:flex;height:56px;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
  .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--font-head);font-size:15px}
  .n60{flex:60;background:#F5F6F8;color:#1F2937}
  .n30{flex:30;background:#0C2746}
  .n10{flex:10;background:#ED7D31}
  .legend{display:flex;gap:24px;margin-top:14px;font-size:13px;color:var(--ink)}
  .legend b{font-family:var(--font-head)}
  .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:middle}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <div class="seg n60">60</div>
    <div class="seg n30">30</div>
    <div class="seg n10">10</div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:#F5F6F8;border:1px solid #ccc"></span><b>60%</b> Neutrals</span>
    <span><span class="dot" style="background:#0C2746"></span><b>30%</b> Navy</span>
    <span><span class="dot" style="background:#ED7D31"></span><b>10%</b> Orange + semantic</span>
  </div>
</div>
</body></html>
