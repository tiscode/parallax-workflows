<!doctype html>

  <div class="f"><span class="glyph" style="font-family:var(--font-head);font-weight:700">Aa</span><div class="meta"><div class="role">Headlines</div><div class="sub">Futura → <b>Jost</b> · weights 400 / 700</div></div></div>
