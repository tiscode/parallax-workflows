<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base · 4–96 ramp" viewport="700x190" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#fff;padding:26px 24px;font-family:var(--font-body)}
  .row{display:flex;align-items:flex-end;gap:10px}
  .t{display:flex;flex-direction:column;align-items:center;gap:7px}
  .bar{background:#92A6C1;width:22px;border-radius:2px}
  .v{font-family:ui-monospace,monospace;font-size:10px;color:var(--label-grey)}
  .note{margin-top:14px;font-size:12px;color:var(--ink)}
  .note b{font-family:var(--font-head);color:#0C2746}
</style></head><body>
<div class="wrap">
  <div class="row">
    <div class="t"><div class="bar" style="height:4px"></div><div class="v">4</div></div>
    <div class="t"><div class="bar" style="height:8px"></div><div class="v">8</div></div>
    <div class="t"><div class="bar" style="height:12px"></div><div class="v">12</div></div>
    <div class="t"><div class="bar" style="height:16px"></div><div class="v">16</div></div>
    <div class="t"><div class="bar" style="height:20px"></div><div class="v">20</div></div>
    <div class="t"><div class="bar" style="height:24px"></div><div class="v">24</div></div>
    <div class="t"><div class="bar" style="height:32px"></div><div class="v">32</div></div>
    <div class="t"><div class="bar" style="height:40px"></div><div class="v">40</div></div>
    <div class="t"><div class="bar" style="height:48px"></div><div class="v">48</div></div>
    <div class="t"><div class="bar" style="height:64px"></div><div class="v">64</div></div>
    <div class="t"><div class="bar" style="height:80px"></div><div class="v">80</div></div>
    <div class="t"><div class="bar" style="height:96px"></div><div class="v">96</div></div>
  </div>
  <div class="note"><b>4px base.</b> &nbsp;16 = component gaps · 32 = section padding · 64–96 = major sections</div>
</div>
</body></html>
