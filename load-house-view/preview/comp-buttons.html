<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="CTA orange + secondary navy outline" viewport="700x150" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#fff;padding:26px;font-family:var(--font-body);display:flex;gap:30px;align-items:center}
  .grp{display:flex;flex-direction:column;gap:12px}
  .lab{font-family:ui-monospace,monospace;font-size:10px;color:var(--label-grey)}
  .row{display:flex;gap:12px;align-items:center}
  .cta{background:#ED7D31;color:#fff;border:0;border-radius:6px;padding:11px 20px;font:600 14px var(--font-body);cursor:pointer}
  .cta.h{filter:brightness(.93)}
  .sec{background:transparent;color:#0C2746;border:1px solid #0C2746;border-radius:6px;padding:10px 19px;font:600 14px var(--font-body)}
  .sep{width:1px;height:80px;background:#eef0f3}
</style></head><body>
<div class="wrap">
  <div class="grp">
    <span class="lab">CTA — orange, max 1–2 / page</span>
    <div class="row"><button class="cta">Schedule a Demo</button><button class="cta h">hover</button></div>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <span class="lab">Secondary — navy outline</span>
    <div class="row"><button class="sec">Read the docs</button></div>
  </div>
</div>
</body></html>
