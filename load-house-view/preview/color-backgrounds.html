<!doctype html>
<!-- @dsCard group="Colors" name="Page backgrounds" subtitle="White / cream / off-white + navy (dark mode)" viewport="700x150" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#e9ebef;padding:24px;font-family:var(--font-body);display:flex;gap:14px}
  .sw{flex:1;display:flex;flex-direction:column;gap:8px}
  .chip{height:70px;border-radius:8px;border:1px solid rgba(12,39,70,.12);display:flex;align-items:flex-end;padding:9px}
  .chip span{font-size:11px;font-weight:600}
  .nm{font-size:12px;font-weight:600;color:var(--ink)}
  .hx{font-family:ui-monospace,monospace;font-size:10px;color:var(--label-grey)}
</style></head><body>
<div class="wrap">
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="nm">White</div><div class="hx">#FFFFFF · default</div></div>
  <div class="sw"><div class="chip" style="background:#F5F2EB"></div><div class="nm">Cream (warm)</div><div class="hx">#F5F2EB · print</div></div>
  <div class="sw"><div class="chip" style="background:#F5F6F8"></div><div class="nm">Off-white (cool)</div><div class="hx">#F5F6F8 · digital</div></div>
  <div class="sw"><div class="chip" style="background:#0C2746"><span style="color:#fff">Aa</span></div><div class="nm">Navy (dark mode)</div><div class="hx">#0C2746 · screens</div></div>
</div>
</body></html>
