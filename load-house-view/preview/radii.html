<!doctype html>
<!-- @dsCard group="Spacing" name="Border radius scale" subtitle="Micro 2 → Full 9999px" viewport="700x150" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#fff;padding:24px;font-family:var(--font-body);display:flex;gap:18px;align-items:flex-end}
  .r{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:76px;height:62px;background:#0C2746}
  .nm{font-size:11px;font-weight:600;color:var(--ink)}
  .v{font-family:ui-monospace,monospace;font-size:10px;color:var(--label-grey)}
</style></head><body>
<div class="wrap">
  <div class="r"><div class="box" style="border-radius:2px"></div><div class="nm">Micro</div><div class="v">2px</div></div>
  <div class="r"><div class="box" style="border-radius:4px"></div><div class="nm">Standard</div><div class="v">4px</div></div>
  <div class="r"><div class="box" style="border-radius:6px"></div><div class="nm">Comfortable</div><div class="v">6px</div></div>
  <div class="r"><div class="box" style="border-radius:8px"></div><div class="nm">Card</div><div class="v">8px</div></div>
  <div class="r"><div class="box" style="border-radius:12px"></div><div class="nm">Panel</div><div class="v">12px</div></div>
  <div class="r"><div class="box" style="border-radius:9999px;width:62px"></div><div class="nm">Full</div><div class="v">9999px</div></div>
</div>
</body></html>
