<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Success / Error / Warning / Alert + soft backgrounds" viewport="700x135" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#fff;padding:22px 24px;font-family:var(--font-body);display:flex;gap:16px}
  .col{flex:1;display:flex;flex-direction:column;gap:8px}
  .pair{display:flex;align-items:center;gap:10px;border-radius:6px;padding:10px 12px}
  .dot{width:14px;height:14px;border-radius:50%}
  .t{font-size:13px;font-weight:600}
  .hx{font-family:ui-monospace,monospace;font-size:10px;margin-left:auto;opacity:.7}
</style></head><body>
<div class="wrap">
  <div class="col">
    <div class="pair" style="background:#ECF5EF"><span class="dot" style="background:#15803D"></span><span class="t" style="color:#15803D">Success · BUY</span><span class="hx" style="color:#15803D">#15803D</span></div>
    <div class="pair" style="background:#F9EDED"><span class="dot" style="background:#B91C1C"></span><span class="t" style="color:#B91C1C">Error · SELL</span><span class="hx" style="color:#B91C1C">#B91C1C</span></div>
  </div>
  <div class="col">
    <div class="pair" style="background:#F9F1EB"><span class="dot" style="background:#B45309"></span><span class="t" style="color:#B45309">Warning · HOLD</span><span class="hx" style="color:#B45309">#B45309</span></div>
    <div class="pair" style="background:#F4DDDD"><span class="dot" style="background:#E3140F"></span><span class="t" style="color:#E3140F">Alert · system</span><span class="hx" style="color:#E3140F">#E3140F</span></div>
  </div>
</div>
</body></html>
