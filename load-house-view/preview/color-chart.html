<!doctype html>
<!-- @dsCard group="Colors" name="Chart palette" subtitle="Brightness-matched categorical series" viewport="700x150" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .wrap{background:#fff;padding:24px;font-family:var(--font-body)}
  .row{display:flex;gap:10px}
  .sw{flex:1;display:flex;flex-direction:column;gap:7px;align-items:center}
  .chip{width:100%;height:50px;border-radius:6px}
  .nm{font-size:11px;color:var(--ink);font-weight:600}
  .hx{font-family:ui-monospace,monospace;font-size:10px;color:var(--label-grey)}
</style></head><body>
<div class="wrap"><div class="row">
  <div class="sw"><div class="chip" style="background:#2563EB"></div><div class="nm">Portfolio</div><div class="hx">#2563EB</div></div>
  <div class="sw"><div class="chip" style="background:#ED7D31"></div><div class="nm">Benchmark</div><div class="hx">#ED7D31</div></div>
  <div class="sw"><div class="chip" style="background:#15803D"></div><div class="nm">Positive</div><div class="hx">#15803D</div></div>
  <div class="sw"><div class="chip" style="background:#B91C1C"></div><div class="nm">Negative</div><div class="hx">#B91C1C</div></div>
  <div class="sw"><div class="chip" style="background:#7C3AED"></div><div class="nm">Series 3</div><div class="hx">#7C3AED</div></div>
  <div class="sw"><div class="chip" style="background:#0E7490"></div><div class="nm">Series 4</div><div class="hx">#0E7490</div></div>
  <div class="sw"><div class="chip" style="background:#B45309"></div><div class="nm">Series 5</div><div class="hx">#B45309</div></div>
</div></div>
</body></html>
