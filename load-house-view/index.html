  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 /* accent (single — cyan) */\n  --cy: #6FC3E8;\n  --cy-pale: #B8D4ED;\n  --cy-deep: #5A9CD8;\n  /* semantic (figures only) */\n  --pos: #2FD673;   /* vivid Bloomberg-style terminal green — pops on dark navy */\n  --neg: #E08585;\n  /* text */\n  --w: #F4F8FD;\n  --w-2: #C4D2E6;           /* secondary */\n  --w-3: #8295B4;           /* muted / meta */\n  --line: rgba(111,195,232,0.18);\n  --card: rgba(255,255,255,0.035);\n  --card-line: rgba(159,183,214,0.16);\n\n  --font-display: \"Inter\", system-ui, Arial, sans-serif;\n  --font-body: \"Futura\", \"Jost\", system-ui, Arial, sans-serif;\n}\n\nhtml, body { margin: 0; background: #02060f; }\ndeck-stage:not(:defined) { visibility: hidden; }\n\n/* ---- Slide shell -------------------------------------------------------- */\nsection {\n  box-sizing: border-box;\n  background: radial-gradient(120% 130% at 28% 12%, var(--bg-a) 0%, var(--bg-b) 60%, #050e24 100%);\n  color: var(--w);\n  font-family: var(--font-body);\n  padding: 78px 84px 72px;\n  overflow: hidden;\n}\n/* Main content slides (everything except the centered cover & thank-you):\n   drop the header down from the top so content sits more toward the middle. */\nsection:not(.center) { padding-top: 112px; }\nsection.deep { background: radial-gradient(120% 130% at 50% 18%, #0a1838 0%, var(--bg-deep) 70%); }\n\n/* ---- Stamps + footer ---------------------------------------------------- */\n.stamp { position: absolute; top: 40px; font-family: var(--font-display); font-weight: 600;\n  font-size: 12.5px; letter-spacing: .22em; color: var(--w-3); text-transform: uppercase; }\n.stamp.l { left: 84px; }\nimg.stamp.l { height: 26px; width: auto; top: 34px; }\nimg.stamp.l.cover-logo { height: 52px; top: 44px; }\n.stamp.r.cover-px { font-size: 23px; top: 58px; letter-spacing: .1em; }\n.stamp.r { right: 84px; color: var(--cy); display: flex; align-items: center; gap: 7px; }\n.stamp.r .dia { color: var(--cy); font-size: 11px; }\n.foot { position: absolute; left: 84px; right: 84px; bottom: 36px; display: flex;\n  justify-content: space-between; align-items: center;\n  font-family: var(--font-display); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; }\n.foot .l { color: var(--w-3); }\n.foot .r { color: var(--cy); font-variant-numeric: tabular-nums; }\n\n/* ---- Type --------------------------------------------------------------- */\n.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 13px;\n  letter-spacing: .26em; text-transform: uppercase; color: var(--cy); }\n.title { font-family: var(--font-display); font-weight: 600; font-size: 40px; line-height: 1.08;\n  letter-spacing: -.015em; color: var(--w); margin: 16px 0 0; max-width: 1040px; }\n.title .cy { color: var(--cy); }\n.lede { font-size: 18px; line-height: 1.5; color: var(--w-2); margin: 16px 0 0; max-width: 940px;\n  font-family: var(--font-body); }\n.foot-note { font-size: 13px; color: var(--w-3); font-family: var(--font-body); }\n.num { font-variant-numeric: tabular-nums lining-nums; font-family: var(--font-display); }\n\n/* ---- Reusable blocks ---------------------------------------------------- */\n.node, .card, .col, .step, .metric { background: var(--card); border: 1px solid var(--card-line);\n  border-radius: 12px; }\n.node.cy, .step.cy { border-color: var(--cy); box-shadow: 0 0 0 1px rgba(111,195,232,.25) inset; }\n.kicker { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .2em;\n  text-transform: uppercase; color: var(--w-3); }\n.kicker.cy { color: var(--cy); }\n.h-card { font-family: var(--font-display); font-weight: 600; font-size: 19px; color: var(--w); }\n.p-card { font-size: 14px; line-height: 1.5; color: var(--w-2); font-family: var(--font-body); }\n.arrow { color: var(--cy-deep); font-family: var(--font-display); font-weight: 600; flex: none; }\n\n/* big stats */\n.stat { font-family: var(--font-display); font-weight: 700; color: var(--cy); line-height: 1;\n  font-size: 78px; letter-spacing: -.02em; }\n.stat .u { font-size: 40px; color: var(--cy-deep); }\n.stat-label { font-size: 16px; color: var(--w-2); margin-top: 10px; font-family: var(--font-body); }\n\n/* bars (factor profile / generic) */\n.bar { height: 9px; border-radius: 99px; background: rgba(159,183,214,.12); overflow: hidden; display: block; }\n.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--cy-deep), var(--cy));\n  transform: scaleX(0); transform-origin: left center; }\n\n/* table */\ntable.rt { width: 100%; border-collapse: collapse; font-family: var(--font-display); }\ntable.rt th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;\n  color: var(--w-3); padding: 0 0 12px; }\ntable.rt th.r, table.rt td.r { text-align: right; }\ntable.rt td { padding: 11px 0; border-top: 1px solid var(--line); font-size: 16px; color: var(--w);\n  font-variant-numeric: tabular-nums; }\ntable.rt td.lab { font-family: var(--font-body); color: var(--w-2); font-size: 15px; }\n.pos { color: var(--pos); } .neg { color: var(--neg); }\n.chip { display: inline-flex; flex-direction: column; gap: 3px; padding: 12px 16px; border-radius: 10px;\n  background: var(--card); border: 1px solid var(--card-line); }\n.chip b { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--w); font-variant-numeric: tabular-nums; }\n.chip span { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--w-3); font-family: var(--font-display); }\n\n.band { border-radius: 12px; border: 1px solid var(--line); background: rgba(111,195,232,.06);\n  padding: 18px 22px; display: flex; align-items: center; gap: 18px; }\n.band .bk { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .18em;\n  text-transform: uppercase; color: var(--cy); flex: none; }\n.band .bt { font-size: 14px; color: var(--w-2); font-family: var(--font-body); line-height: 1.45; }\n\n/* cover meta */\n.meta { display: flex; gap: 28px; font-family: var(--font-display); font-size: 12px; letter-spacing: .2em;\n  text-transform: uppercase; color: var(--w-3); }\n.meta .d { color: var(--cy); }\n\n/* =============================================================================\n   ENTRANCE ANIMATIONS — base state = visible; animate FROM hidden, gated on\n   [data-deck-active] + reduced-motion. Replays each time a slide becomes active.\n   ============================================================================= */\n@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }\n@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n@keyframes wipeL { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }\n@keyframes popIn { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }\n@keyframes lineDraw { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n\n@media (prefers-reduced-motion: no-preference) {\n  [data-deck-active] .anim { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }\n  [data-deck-active] .wipe { animation: wipeL .6s cubic-bezier(.2,.7,.3,1) both; }\n  [data-deck-active] .pop  { animation: popIn .5s cubic-bezier(.2,.8,.3,1) both; }\n  [data-deck-active] .bar > i { animation: growX .8s .15s cubic-bezier(.2,.7,.3,1) both; }\n  [data-deck-active] .arrow.draw { animation: lineDraw .4s both; transform-origin: left center; }\n\n  /* stagger helpers */\n  .d1{animation-delay:.08s!important}.d2{animation-delay:.18s!important}.d3{animation-delay:.28s!important}\n  .d4{animation-delay:.38s!important}.d5{animation-delay:.48s!important}.d6{animation-delay:.58s!important}\n  .d7{animation-delay:.70s!important}.d8{animation-delay:.82s!important}.d9{animation-delay:.94s!important}\n  [data-deck-active] .bar.b1>i{animation-delay:.30s}[data-deck-active] .bar.b2>i{animation-delay:.42s}\n  [data-deck-act 0 !important; }\n  section.splitlight .zone.s4fill {\n    padding: 0 84px; min-height: 456px;\n    display: flex; flex-direction: column; justify-content: center; gap: 60px;\n  }\n  section.splitlight .s4fill .stats3 { margin-top: 0 !important; }\n  section.splitlight .s4fill .stat { font-size: 96px; }\n  section.splitlight .s4fill .stat .u { font-size: 52px; }\n  section.splitlight .s4fill .stat-label { font-size: 18px; margin-top: 16px; }\n  section.splitlight .s4fill .stats3 > div + div { border-left: 1px solid var(--line); }\n  section.splitlight .s4fill .band { margin-top: 0 !important; padding: 22px 28px; }\n  section.splitlight .s4fill .band .bt { font-size: 16px; }\n  section.splitlight .zone.s6fill {\n    padding: var(--s6-top, 80px) 84px 0; height: 434px; box-sizing: border-box;\n    display: flex; flex-direction: column;\n  }\n  section.splitlight .s6fill .cards4 {\n    margin-top: 0 !important; height: var(--s6-cards-h, 286px); grid-template-rows: 1fr 1fr; gap: 20px;\n  }\n  section.splitlight .s6fill .cards4 .card { padding: 20px 32px; gap: 24px; min-height: 0; align-items: center; }\n  section.splitlight .s6fill .cico svg { width: 36px; height: 36px; }\n  section.splitlight .s6fill .h-card { font-size: 20px; }\n  section.splitlight .s6fill .p-card { font-size: 15px; line-height: 1.48; }\n  section.splitlight .stamp.r { color: #6FC3E8; }\n  section.splitlight .card, section.splitlight .node, section.splitlight .col,\n  section.splitlight .step, section.splitlight .metric, section.splitlight .chip {\n    box-shadow: 0 1px 3px rgba(12,39,70,.07), 0 1px 2px rgba(12,39,70,.04);\n  }\n  section.splitlight .band { background: #EEF4FD; border-color: #D6E2F5; }\n  section.splitlight .bar { background: #E3E8F0; }\n\n  /* Before/after table: top-align every row's content so the left label lines\n     up with the first line of the \"Today\" column (and the rest of the row). */\n  .ba > * { align-self: start; }\n  /* …but the connector arrows sit centered within each row. */\n  .ba .ba-ar { align-self: center; }\n<\u002Fstyle>\n<script src=\"d2c1b2a6-622a-4e6c-aa69-28f7d4180b66\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"9d85bc80-026e-4657-a69a-a1116188db88#/deck-stage.js\" width=\"1280\" height=\"800\" hint-size=\"100%,100%\">\n\n  <!-- 1 · COVER -->\n  <section class=\"deep center\" data-label=\"Cover\" data-screen-label=\"01 Cover\">\n    <img class=\"stamp l cover-logo\" src=\"60ee05f3-88dd-4257-95ee-776b81e8d056\" alt=\"Chicago Global\">\n    <div class=\"stamp r cover-px\">Parallax<\u002Fdiv>\n    <div class=\"eyebrow anim d1\">CHICAGO GLOBAL × PARALLAX<\u002Fdiv>\n    <h1 class=\"title anim d2\" style=\"font-size:72px;max-width:1080px;margin-top:22px;\">\n      Your house view,<br><span class=\"cy\">in partnership with Parallax.<\u002Fspan><\u002Fh1>\n    <p class=\"lede anim d4\" style=\"font-size:19px;margin-top:24px;max-width:880px;\">\n      Your CIO defines direction. Parallax translates each tilt into implementable stocks, ETFs, themes,\n      and sector calls, following your approval, with no change to how your CIO publishes.<\u002Fp>\n    <div class=\"meta anim d5\" style=\"position:absolute;left:0;right:0;bottom:60px;justify-content:center;margin-top:0;\">\n      <span>Investment-Intelligence Partnership<\u002Fspan>\n      <span class=\"d\">·<\u002Fspan>\n      <span>For Institutional Discussion<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 2 · PARTNERSHIP MODEL -->\n  <section data-label=\"Partnership\" data-screen-label=\"02 Partnership model\">\n    <img class=\"stamp l\" src=\"60ee05f3-88dd-4257-95ee-776b81e8d056\" alt=\"Chicago Global\"><div class=\"stamp r\">Parallax<\u002Fdiv>\n    <div class=\"eyebrow anim\">The partnership model<\u002Fdiv>\n    <h1 class=\"title anim d1\" style=\"max-width:none;\"><span style=\"display:block;\">We complement your house view,<\u002Fspan><span style=\"display:block;\">we don’t replace it.<\u002Fspan><\u002Fh1>\n    <p class=\"lede anim d2\">Parallax does not generate, replace, or compete with your view; it complements\n      through a one-way connection. The view remains yours.<\u002Fp>\n    <div class=\"flow\">\n      <div class=\"node anim d3\"><span class=\"kicker\">CIO · Top-down<\u002Fspan>\n        <span class=\"h-card\">Strategic Asset Allocation<\u002Fspan>\n        <span class=\"p-card\">Mix of equity, credit, and bonds, anchored to client risk profile and horizon.<\u002Fspan><\u002Fdiv>\n      <span class=\"arrow draw d4\">→<\u002Fspan>\n      <div class=\"node anim d5\"><span class=\"kicker\">CIO · Top-down<\u002Fspan>\n        <span class=\"h-card\">Tactical Asset Allocation<\u002Fspan>\n        <span class=\"p-card\">1 to 10 year tilts across macro, valuation, technicals, and sentiment indicators.<\u002Fspan><\u002Fdiv>\n      <span class=\"arrow draw d6\">→<\u002Fspan>\n      <div class=\"node cy anim d7\"><span class=\"kicker cy\">Parallax · Bottom-up<\u002Fspan>\n        <span class=\"h-card\">Portfolio Construction<\u002Fspan>\n        <span class=\"p-card\">Parallax is in this domain: quant-driven stocks, ETFs, themes, and sectors, ranked by six-factor score.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"foot-note anim d8\" style=\"margin-top:24px;\">One-way data flow. Parallax pulls from your systems only; it never writes back.<\u002Fp>\n    <div class=\"foot\"><span class=\"l\">Chicago Global · Parallax · Solve the market.<\u002Fspan><span class=\"r\">02 / 11<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3 · BOTTOM-UP IN ACTION -->\n  <section data-label=\"Bottom-up\" data-screen-label=\"03 Bottom-up in action\">\n    <img class=\"stamp l\" src=\"60ee05f3-88dd-4257-95ee-776b81e8d056\" alt=\"Chicago Global\"><div class=\"stamp r\">Parallax<\u002Fdiv>\n    <div class=\"eyebrow anim\">Bottom-up in action<\u002Fdiv>\n    <h1 class=\"title anim d1\">From your view to implementable names.<\u002Fh1>\n    <p class=\"lede anim d2\">Each top-down tilt resolves into ranked, scored, sourced holdings, in your house frame.<\u002Fp>\n    <div class=\"cols3\">\n      <div class=\"col anim d3\"><span class=\"kicker cy\">Parallax delivers<\u002Fspan>\n        <span class=\"h-card\">Country or region tilt<\u002Fspan>\n        <span class=\"p-card\">Ranked stocks within the target market, matching country and region ETFs, and region-tilted thematic baskets, each scored across six factors.<\u002Fspan><\u002Fdiv>\n      <div class=\"col anim d4\"><span class=\"kicker cy\">Parallax delivers<\u002Fspan>\n        <span class=\"h-card\">Sector or theme tilt<\u002Fspan>\n        <span class=\"p-card\">Peer-screened equities within the sector or theme, matching ETFs, and thematic portfolio baskets, ranked by six-factor score.<\u002Fspan><\u002Fdiv>\n      <div class=\"col anim d5\"><span class=\"kicker cy\">Parallax delivers<\u002Fspan>\n        <span class=\"h-card\">Factor-ranked tilt<\u002Fspan>\n        <span class=\"p-card\">Factor-ranked candidates within each segment under coverage, aligned to your mandate and sequenced country → region → sector → factor.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"band wipe d6\" style=\"margin-top:26px;\">\n      <span class=\"bk\">Whole-portfolio overlay · Ex-ante &amp; ex-post<\u002Fspan>\n      <span class=\"bt\">Selected names are assessed as one portfolio. Ex-ante before deployment (volatility, Sharpe, beta, factor and style exposure) and ex-post each cycle (realised volatility, drawdown, attribution).<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"foot\"><span class=\"l\">Chicago Global · Parallax · Solve the market.<\u002Fspan><span class=\"r\">03 / 11<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4 · IMPLEMENTATION CAPABILITY -->\n  <section class=\"splitlight\" data-label=\"Implementation\" data-screen-label=\"04 Implementation capability\">\n    <img class=\"stamp l\" src=\"60ee05f3-88dd-4257-95ee-776b81e8d056\" alt=\"Chicago Global\"><div class=\"stamp r\">Parallax<\u002Fdiv>\n    <div class=\"hdr\">\n    <div class=\"eyebrow anim\">Capability · Implementation<\u002Fdiv>\n    <h1 class=\"title anim d1\">Every tilt becomes a ranked, scored, sourced holding.<\u002Fh1>\n    <p class=\"lede anim d2\">Parallax is a Large Investment Model that discovers, scores, constructs, and explains investment decisions.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"zone s4fill\">\n    <div class=\"stats3\">\n      <div class=\"anim d3\"><div class=\"stat\"><span class=\"num\" data-countup=\"65000\" data-suffix=\"+\">65,000+<\u002Fspan><\u002Fdiv><div class=\"stat-label\">securities covered globally<\u002Fdiv><\u002Fdiv>\n      <div class=\"anim d4\"><div class=\"stat\"><span class=\"num\" data-countup=\"7000\" data-suffix=\"+\">7,000+<\u002Fspan><\u002Fdiv><div class=\"stat-label\">ETFs scored<\u002Fdiv><\u002Fdiv>\n      <div class=\"anim d5\"><div class=\"stat\"><span class=\"num\" data-countup=\"48\" data-suffix=\"\">48<\u002Fspan><\u002Fdiv><div class=\"stat-label\">global markets<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"band wipe d7\" style=\"margin-top:48px;\">\n      <span class=\"bk\">Factor scoring<\u002Fspan>\n      <span class=\"bt\"><b style=\"color:var(--w)\">Quality, Defensive, Momentum, Value, Tactical<\u002Fb> drive the composite score. <b style=\"color:var(--w)\">Size<\u002Fb> is applied at portfolio construction for capacity and liquidity.<\u002Fspan>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span class=\"l\">Chicago Global · Parallax · Solve the market.<\u002Fspan><span class=\"r\">04 / 11<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 5 · TOTAL-PORTFOLIO RISK LENS -->\n  <section class=\"splitlight\" data-label=\"Risk lens\" data-screen-label=\"05 Total-portfolio risk lens\">\n    <img class=\"stamp l\" src=\"60ee05f3-88dd-4257-95ee-776b81e8d056\" alt=\"Chicago Global\"><div class=\"stamp r\">Parallax<\u002Fdiv>\n    <div class=\"hdr\">\n    <div class=\"eyebrow anim\">Capability · Total-portfolio risk lens<\u002Fdiv>\n    <h1 class=\"title anim d1\" style=\"font-size:34px;\">Not just stock picks. A whole-portfolio risk and return view.<\u002Fh1>\n    <p class=\"lede anim d2\" style=\"font-size:16px;\">A real Parallax sample (Alpha Maximizer: 30 holdings across 7 sectors), scored as one portfolio against MSCI ACWI: comparable return at materially lower risk.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"zone\">\n    <div style=\"display:grid;grid-template-columns:1.05fr 1fr;gap:52px;margin-top:30px;\">\n      <div>\n        <table class=\"rt\">\n          <thead><tr><th>Metric<\u002Fth><th class=\"r\">Portfolio<\u002Fth><th class=\"r\">MSCI ACWI<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr class=\"anim d3\"><td class=\"lab\">Total return<\u002Ftd><td class=\"r\">+66.46%<\u002Ftd><td class=\"r\">+68.17%<\u002Ftd><\u002Ftr>\n            <tr class=\"anim d4\"><td class=\"lab\">Annualized return<\u002Ftd><td class=\"r\">+22.22%<\u002Ftd><td class=\"r\">+22.71%<\u002Ftd><\u002Ftr>\n            <tr class=\"anim d5\"><td class=\"lab\">Annualized volatility<\u002Ftd><td class=\"r\">10.86%<\u002Ftd><td class=\"r\">12.35%<\u002Ftd><\u002Ftr>\n            <tr class=\"anim d6\"><td class=\"lab\">Max drawdown<\u002Ftd><td class=\"r pos\">−12.72%<\u002Ftd><td class=\"r neg\">−16.55%<\u002Ftd><\u002Ftr>\n            <tr class=\"anim d7\"><td class=\"lab\">Sharpe ratio<\u002Ftd><td class=\"r pos\">1.21<\u002Ftd><td class=\"r\">1.09<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;\">\n          <div class=\"chip pop d6\"><b class=\"pos\">+10.84%<\u002Fb><span>CAPM alpha<\u002Fspan><\u002Fdiv>\n          <div class=\"chip pop d7\"><b>0.45<\u002Fb><span>Beta<\u002Fspan><\u002Fdiv>\n          <div class=\"chip pop d8\"><b>1.75<\u002Fb><span>Calmar<\u002Fspan><\u002Fdiv>\n          <div class=\"chip pop d9\"><b>48%<\u002Fb><span>Down-capture<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;\">\n          <span class=\"kicker\">Parallax factor profile<\u002Fspan>\n          <span style=\"font-family:var(--font-display);\"><b class=\"pos\" style=\"font-size:30px;font-weight:700;\">99<\u002Fb><span style=\"color:var(--w-3);font-size:13px;\">&nbsp;/ 100 composite<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;\">\n          <div class=\"anim d3\"><div style=\"display:flex;justify-content:space-between;font-size:13px;color:var(--w-2);margin-bottom:5px;\"><span>Value<\u002Fspan><span class=\"num\">67<\u002Fspan><\u002Fdiv><span class=\"bar b1\"><i style=\"width:67%\"><\u002Fi><\u002Fspan><\u002Fdiv>\n          <div class=\"anim d3\"><div style=\"display:flex;justify-content:space-between;font-size:13px;color:var(--w-2);margin-bottom:5px;\"><span>Quality<\u002Fspan><span class=\"num\">83<\u002Fspan><\u002Fdiv><span class=\"bar b2\"><i style=\"width:83%\"><\u002Fi><\u002Fspan><\u002Fdiv>\n          <div class=\"anim d4\"><div style=\"display:flex;justify-content:space-between;font-size:13px;color:var(--w-2);margin-bottom:5px;\"><span>Momentum<\u002Fspan><span class=\"num\">87<\u002Fspan><\u002Fdiv><span class=\"bar b3\"><i style=\"width:87%\"><\u002Fi><\u002Fspan><\u002Fdiv>\n          <div class=\"anim d4\"><div style=\"display:flex;justify-content:space-between;font-size:13px;color:var(--w-2);margin-bottom:5px;\"><span>Defensive<\u002Fspan><span class=\"num\">46<\u002Fspan><\u002Fdiv><span class=\"bar b4\"><i style=\"width:46%\"><\u002Fi><\u002Fspan><\u002Fdiv>\n          <div class=\"anim d5\"><div style=\"display:flex;justify-content:space-between;font-size:13px;color:var(--w-2);margin-bottom:5px;\"><span>Tactical<\u002Fspan><span class=\"num\">68<\u002Fspan><\u002Fdiv><span class=\"bar b5\"><i style=\"width:68%\"><\u002Fi><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"band wipe d8\" style=\"margin-top:16px;display:block;\">\n          <span class=\"bk\">Style read<\u002Fspan>\n          <span class=\"bt\" style=\"display:block;margin-top:6px;\">Quality- and momentum-led with a real value tilt, lighter on defensive: a low-beta (0.45) expression of a growth book. Captured 65% of ACWI’s upside, just 48% of its downside.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"foot-note anim d9\" style=\"margin-top:12px;font-size:13px;color:var(--w-2);max-width:1180px;\">Illustrative sample portfolio (Alpha Maximizer), real Parallax analytics vs MSCI ACWI. Past performance is not indicative of future results.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"foot\"><span class=\"l\"><span class=\"flag\">Sample Parallax portfolio<\u002Fspan><span class=\"det\">Alpha Maximizer · 30 holdings / 7 sectors · vs MSCI ACWI<\u002Fspan><\u002Fspan><span class=\"r\">05 / 11<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 6 · GOVERNANCE -->\n  <section class=\"splitlight\" data-label=\"Governance\" data-screen-label=\"06 Governance &amp; trust\">\n    <img class=\"stamp l\" src=\"60ee05f3-88dd-4257-95ee-776b81e8d056\" alt=\"Chicago Global\"><div class=\"stamp r\">Parallax<\u002Fdiv>\n    <div class=\"hdr\">\n    <div class=\"eyebrow anim\">Capability · Governance<\u002Fdiv>\n    <h1 class=\"title anim d1\">Your authority, preserved and audited.<\u002Fh1>\n    <p class=\"lede anim d2\">Outputs stay draft until your named owner approves. Every change logged, versioned, and defensible.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"zone s6fill\">\n    <div class=\"cards4\">\n      <div class=\"card anim d3\"><span class=\"cico\" data-ic=\"user-check\" data-sz=\"32\"><\u002Fspan><div class=\"ctext\"><span class=\"h-card\">Human overlay<\u002Fspan><span class=\"p-card\">No activation until named-owner approval is recorded. Every override is logged with the change, rationale, and prior version.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"card anim d4\"><span class=\"cico\" data-ic=\"shield-check\" data-sz=\"32\"><\u002Fspan><div class=\"ctext\"><span class=\"h-card\">Traceability &amp; compliance<\u002Fspan><span class=\"p-card\">Source-linked outputs and version history. Same input → same output. Defensible to MAS, FCA, SFC, SEC.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"card anim d5\"><span class=\"cico\" data-ic=\"repeat\" data-sz=\"32\"><\u002Fspan><div class=\"ctext\"><span class=\"h-card\">Agility<\u002Fspan><span class=\"p-card\">When your house view evolves, Parallax re-aligns to the latest approved view, so analytics stay inside your house frame.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"card anim d6\"><span class=\"cico\" data-ic=\"share-2\" data-sz=\"32\"><\u002Fspan><div class=\"ctext\"><span class=\"h-card\">Multi-surface delivery<\u002Fspan><span class=\"p-card\">Approved outputs reach configured surfaces: API, MCP, and web console, per your deployment scope.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\"><span class=\"l\">Chicago Global · Parallax · Solve the market.<\u002Fspan><span class=\"r\">06 / 11<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7 · MONTHLY CYCLE -->\n  <section data-label=\"Monthly cycle\" data-screen-label=\"07 Monthly cycle\">\n    <img class=\"stamp l\" src=\"60ee05f3-88dd-4257-95ee-776b81e8d056\" alt=\"Chicago Global\"><div class=\"stamp r\">Parallax<\u002Fdiv>\n    <div class=\"eyebrow anim\">How it runs<\u002Fdiv>\n    <h1 class=\"title anim d1\">One monthly publishing cycle.<\u002Fh1>\n    <p class=\"lede anim d2\">Your cadence, unchanged. Parallax fits between publish and deliver: one-way, draft until approved.<\u002Fp>\n    <div class=\"steps cycle\">\n      <div class=\"step anim d3\"><div class=\"edge top\" aria-hidden=\"true\"><span class=\"seg s1\"><\u002Fspan><span class=\"seg s2\"><\u002Fspan><\u002Fdiv><div class=\"edge bottom\" aria-hidden=\"true\"><span class=\"seg s1\"><\u002Fspan><span class=\"seg s2\"><\u002Fspan><\u002Fdiv><span class=\"stepno\">01<\u002Fspan><span class=\"h-card\" style=\"font-size:16px;\">Publish<\u002Fspan><span class=\"p-card\">Your CIO publishes the house view on your existing cadence.<\u002Fspan><\u002Fdiv>\n      <span class=\"arrow draw d3\">→<\u002Fspan>\n      <div class=\"step anim d4\"><div class=\"edge top\" aria-hidden=\"true\"><span class=\"seg s1\"><\u002Fspan><span class=\"seg s2\"><\u002Fspan><\u002Fdiv><div class=\"edge bottom\" aria-hidden=\"true\"><span class=\"seg s1\"><\u002Fspan><span class=\"seg s2\"><\u002Fspan><\u002Fdiv><span class=\"stepno\">02<\u002Fspan><span class=\"h-card\" style=\"font-size:16px;\">Ingest<\u002Fspan><span class=\"p-card\">Parallax pulls the view through the connector and aligns bottom-up data against it.<\u002Fspan><\u002Fdiv>\n      <span class=\"arrow draw d4\">→<\u002Fspan>\n      <div class=\"step anim d5\"><div class=\"edge top\" aria-hidden=\"true\"><span class=\"seg s1\"><\u002Fspan><span class=\"seg s2\"><\u002Fspan><\u002Fdiv><div class=\"edge bottom\" aria-hidden=\"true\"><span class=\"seg s1\"><\u002Fspan><span class=\"seg s2\"><\u002Fspan><\u002Fdiv><span class=\"stepno\">03<\u002Fspan><span class=\"h-card\" style=\"font-size:16px;\">Structure<\u002Fspan><span class=\"p-card\">Implementable names surface under each tilt with source provenance. Draft-level.<\u002Fspan><\u002Fdiv>\n      <span class=\"arrow draw d5\">→<\u002Fspan>\n      <div class=\"step anim d6\"><div class=\"edge top\" aria-hidden=\"true\"><span class=\"seg s1\"><\u002Fspan><span class=\"seg s2\"><\u002Fspan><\u002Fdiv><div class=\"edge bottom\" aria-hidden=\"true\"><span class=\"seg s1\"><\u002Fspan><span class=\"seg s2\"><\u002Fspan><\u002Fdiv><span class=\"stepno\">04<\u002Fspan><span class=\"h-card\" style=\"font-size:16px;\">Approve<\u002Fspan><span class=\"p-card\">Your named owner reviews and approves at the human overlay.<\u002Fspan><\u002Fdiv>\n      <span class=\"arrow draw d6\">→<\u002Fspan>\n      <div class=\"step anim d7\"><div class=\"edge top\" aria-hidden=\"true\"><span class=\"seg s1\"><\u002Fspan><span class=\"seg s2\"><\u002Fspan><\u002Fdiv><div class=\"edge bottom\" aria-hidden=\"true\"><span class=\"seg s1\"><\u002Fspan><span class=\"seg s2\"><\u002Fspan><\u002Fdiv><span class=\"stepno\">05<\u002Fspan><span class=\"h-card\" style=\"font-size:16px;\">Deliver<\u002Fspan><span class=\"p-card\">Available across configured surfaces. The cycle continues.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"foot-note anim d8\" style=\"margin-top:26px;\">Ambiguous outputs are flagged for review, not activated automatically.<\u002Fp>\n    <div class=\"foot\"><span class=\"l\">Chicago Global · Parallax · Solve the market.<\u002Fspan><span class=\"r\">07 / 11<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8 · OPERATING DETAIL -->\n  <section data-label=\"Operating detail\" data-screen-label=\"08 Operating detail\">\n    <img class=\"stamp l\" src=\"60ee05f3-88dd-4257-95ee-776b81e8d056\" alt=\"Chicago Global\"><div class=\"stamp r\">Parallax<\u002Fdiv>\n    <div class=\"eyebrow anim\">Operating detail<\u002Fdiv>\n    <h1 class=\"title anim d1\">Roles, workflow, and human override.<\u002Fh1>\n    <p class=\"lede anim d2\">Clear ownership at every step, and a parser that never overrides human judgment.<\u002Fp>\n    <div class=\"two\">\n      <div>\n        <div class=\"kicker cy anim d3\" style=\"margin-bottom:6px;\">Governance roles<\u002Fdiv>\n        <div class=\"role anim d3\"><span class=\"h-card\" style=\"font-size:16px;\">Owner<\u002Fspan><div class=\"p-card\">Approves and activates. Typically CIO or IC chair.<\u002Fdiv><\u002Fdiv>\n        <div class=\"role anim d4\"><span class=\"h-card\" style=\"font-size:16px;\">Reviewer<\u002Fspan><div class=\"p-card\">PM or research lead validates each tilt aga ype&quot;:&quot;number&quot;},&quot;cycleSpeed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:6,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const props = this.props || {};\n    const FLAG_COLORS = {\n      orange: ['#ED7D31', '#ffffff'],\n      blue:   ['#4FC3F7', '#ffffff'],\n      maroon: ['#C13A5B', '#ffffff']\n    };\n    const tw = {\n      s6Top: 68, s6CardsH: 340,\n      flagColor: props.flagColor || 'blue',\n      starTail: -26, starAlpha: 0.95, starBright: 0.3,\n      starSpeed: props.starSpeed != null ? props.starSpeed : 16,\n      cycle7: props.cycleSpeed != null ? props.cycleSpeed : 14\n    };\n    const applyVars = function () {\n      const r = document.documentElement.style;\n      r.setProperty('--s6-top', tw.s6Top + 'px');\n      r.setProperty('--s6-cards-h', tw.s6CardsH + 'px');\n      const fc = FLAG_COLORS[tw.flagColor] || FLAG_COLORS.orange;\n      r.setProperty('--flag-bg', fc[0]);\n      r.setProperty('--flag-fg', fc[1]);\n      r.setProperty('--star-tail', tw.starTail + 'deg');\n      r.setProperty('--star-alpha', tw.starAlpha);\n      r.setProperty('--star-bright', tw.starBright);\n      r.setProperty('--star-speed', tw.starSpeed + 's');\n      r.setProperty('--cycle7', tw.cycle7 + 's');\n    };\n    applyVars();\n\n    // ---- Polaris / constellation starfield (deterministic) ----------------\n    const FULL = [\n      [60,120,1.2,.30,0],[150,300,1.5,.40,1],[90,520,1.1,.25,0],[210,90,1.3,.35,0],\n      [260,430,1.0,.25,1],[180,650,1.4,.30,0],[330,200,1.2,.35,1],[300,560,1.1,.25,0],\n      [420,110,1.5,.40,0],[400,330,1.0,.25,1],[470,500,1.3,.30,0],[380,690,1.1,.25,1],\n      [540,180,1.2,.30,1],[560,400,1.4,.35,0],[520,630,1.0,.22,0],[620,90,1.3,.35,1],\n      [645,285,1.1,.28,0],[600,520,1.2,.30,1],[700,165,1.0,.25,0],[725,410,1.4,.35,0],\n      [680,650,1.1,.25,1],[785,105,1.3,.30,1],[805,310,1.2,.30,0],[760,540,1.0,.22,0],\n      [845,430,1.3,.32,1],[885,185,1.1,.28,0],[905,610,1.2,.30,1],[945,330,1.0,.24,0],\n      [1010,505,1.3,.30,0],[960,680,1.1,.25,1],[1150,425,1.3,.32,1],[1225,300,1.2,.30,0],\n      [1240,560,1.1,.25,0],[1100,610,1.2,.30,1],[1185,685,1.0,.24,0],\n      [1188,104,3.0,.95,1],[1124,150,1.9,.60,1],[1066,196,1.7,.52,0],[1014,226,1.8,.55,1],\n      [992,176,1.5,.46,0],[1048,150,1.5,.46,1],[1098,202,1.6,.50,0]\n    ];\n    const field = function (stars, w, h) {\n      const c = stars.map(function (s, idx) {\n        const twk = (idx % 3 === 0);\n        const extra = twk ? ' class=\"tw\" style=\"animation-duration:' + (2.4 + (idx % 5) * 0.7).toFixed(1) +\n          's;animation-delay:' + ((idx % 8) * 0.4).toFixed(2) + 's\"' : '';\n        return '<circle cx=\"' + s[0] + '\" cy=\"' + s[1] + '\" r=\"' + s[2] + '\" fill=\"' +\n          (s[4] ? '#EAF6FC' : '#6FC3E8') + '\" fill-opacity=\"' + s[3] + '\"' + extra + '/>';\n      }).join('');\n      return '<svg viewBox=\"0 0 ' + w + ' ' + h + '\" preserveAspectRatio=\"xMidYMid slice\" ' +\n        'fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">' + c + '<\u002Fsvg>';\n    };\n\n    const easeOut = function (t) { return 1 - Math.pow(1 - t, 3); };\n    const runCountUp = function (el) {\n      if (el._cuRunning) cancelAnimationFrame(el._cuRunning);\n      const target = parseFloat(el.getAttribute('data-countup'));\n      const suf = el.getAttribute('data-suffix') || '';\n      const dur = parseInt(el.getAttribute('data-dur') || '1100', 10);\n      const start = performance.now();\n      function frame(now) {\n        const p = Math.min(1, (now - start) / dur);\n        const v = Math.round(Math.abs(target) * easeOut(p)).toLocaleString('en-US');\n        el.textContent = v + suf;\n        if (p < 1) el._cuRunning = requestAnimationFrame(frame);\n      }\n      el.textContent = '0' + suf;\n      el._cuRunning = requestAnimationFrame(frame);\n    };\n    const animateSlide = function (slide) {\n      if (!slide) return;\n      slide.querySelectorAll('[data-countup]').forEach(runCountUp);\n    };\n\n    // The deck-stage element + its slotted sections may not exist until the\n    // <x-import> has loaded deck-stage.js and mounted. Poll briefly, then\n    // wire icons, starfield, and count-ups once the slides are present.\n    let tries = 0;\n    const setup = () => {\n      const deck = document.querySelector('deck-stage');\n      const secs = deck ? deck.querySelectorAll(':scope > section') : [];\n      if (!deck || !secs.length) {\n        if (tries++ < 60) { setTimeout(setup, 80); }\n        return;\n      }\n      if (deck.dataset.lhvInit) return;\n      deck.dataset.lhvInit = '1';\n\n      // Safety: deck-stage hides its stage behind data-fonts-pending until\n      // document.fonts.ready resolves via a rAF; in frames where that rAF\n      // doesn't fire the flag (and the opacity:0 it gates) can stick. Fonts\n      // are already loaded by the time slides exist, so clear it.\n      const clearPending = function () { deck.removeAttribute('data-fonts-pending'); };\n      clearPending();\n      setTimeout(clearPending, 400);\n      setTimeout(clearPending, 1500);\n\n      // deck-stage._fit() scales the shadow-DOM .canvas to min(vw/1280, vh/800).\n      // In an embedded preview the iframe can report 0×0 layout at mount, so\n      // _fit locks in scale(0) and the stage paints black until a real resize\n      // fires. Nudge a re-fit until the canvas has a non-zero scale, and keep\n      // a ResizeObserver so it re-fits the moment the frame gets real size.\n      const refit = function () { try { window.dispatchEvent(new Event('resize')); } catch (e) {} };\n      const canvasScaledZero = function () {\n        const c = deck.shadowRoot && deck.shadowRoot.querySelector('.canvas');\n        if (!c) return true;\n        const t = getComputedStyle(c).transform;\n        return t === 'matrix(0, 0, 0, 0, 0, 0)' || t === 'scale(0)' || /matrix\\(0,/.test(t);\n      };\n      // Keep nudging a re-fit until the viewport actually has real dimensions\n      // AND the canvas is no longer scaled to 0. The embedded preview can\n      // report innerWidth 0 for a while after mount and its ResizeObserver\n      // doesn't always fire for the 0->real transition, so we poll on a long\n      // rAF watcher rather than a short fixed timer — but stop immediately\n      // once the canvas is correctly scaled so we don't spin forever.\n      let watchStart = performance.now();\n      const watchFit = function () {\n        const haveSize = (window.innerWidth || 0) > 0 && (window.innerHeight || 0) > 0;\n        if (haveSize) refit();\n        const ok = haveSize && !canvasScaledZero();\n        // Keep watching for up to ~15s of wall time, or until corrected.\n        if (!ok && performance.now() - watchStart < 15000) {\n          requestAnimationFrame(watchFit);\n        }\n      };\n      requestAnimationFrame(watchFit);\n      // Backup ticker in case rAF is throttled while the frame is offscreen.\n      let ticks = 0;\n      const tick = setInterval(function () {\n        if (((window.innerWidth || 0) > 0) && !canvasScaledZero()) { clearInterval(tick); return; }\n        refit();\n        if (ticks++ > 80) clearInterval(tick);\n      }, 150);\n      if (window.ResizeObserver) {\n        const ro = new ResizeObserver(function () { if (canvasScaledZero()) refit(); });\n        ro.observe(document.documentElement);\n        try { ro.observe(document.body); } catch (e) {}\n      }\n\n      // inline line-icons\n      if (window.PXICONS) {\n        deck.querySelectorAll('[data-ic]').forEach(function (el) {\n          if (el.firstChild) return;\n          const inner = window.PXICONS[el.getAttribute('data-ic')] || '';\n          const sz = el.getAttribute('data-sz') || 24;\n          el.innerHTML = '<svg width=\"' + sz + '\" height=\"' + sz + '\" viewBox=\"0 0 24 24\" fill=\"none\" ' +\n            'stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' + inner + '<\u002Fsvg>';\n        });\n      }\n\n      // starfield motif — clipped to the navy header on splitlight slides\n      secs.forEach(function (sec) {\n        if (sec.querySelector(':scope > .deco, :scope > .hdr > .deco')) return;\n        const hdr = sec.querySelector('.hdr');\n        const host = hdr || sec;\n        const d = document.createElement('div');\n        d.className = hdr ? 'deco clip' : 'deco';\n        d.setAttribute('aria-hidden', 'true');\n        d.innerHTML = field(FULL, 1280, 800);\n        host.insertBefore(d, host.firstChild);\n      });\n\n      // count-ups, triggered as each slide becomes active\n      deck.addEventListener('slidechange', function (e) {\n        setTimeout(function () { animateSlide(e.detail && e.detail.slide); }, 260);\n      });\n      const active = deck.querySelector('[data-deck-active]') || secs[0];\n      if (active) setTimeout(function () { animateSlide(active); }, 400);\n\n      // Some embedded preview frames throttle/pause the CSS animation\n      // timeline (rAF never advances). The deck's entrance animations use\n      // animation-fill-mode:both, so a paused timeline holds them at the\n      // opacity:0 start frame and slides look blank. Detect that and settle\n      // content to its visible end-state — the same fallback the deck uses\n      // for print / reduced-motion. If the timeline IS running, the cover's\n      // entrance has finished by now (max ~1.0s) and we leave it alone.\n      const settle = function () {\n        if (document.getElementById('lhv-settle')) return;\n        const s = document.createElement('style');\n        s.id = 'lhv-settle';\n        s.textContent = '.anim,.wipe,.pop{opacity:1 !important;transform:none !important;clip-path:none !important;animation:none !important}' +\n          '.bar>i{transform:scaleX(1) !important;animation:none !important}';\n        document.head.appendChild(s);\n        deck.querySelectorAll('[data-countup]').forEach(function (el) {\n          const target = parseFloat(el.getAttribute('data-countup'));\n          const suf = el.getAttribute('data-suffix') || '';\n          el.textContent = Math.round(Math.abs(target)).toLocaleString('en-US') + suf;\n        });\n      };\n      setTimeout(function () {\n        const probe = deck.querySelector('[data-deck-active] .anim');\n        const op = probe ? parseFloat(getComputedStyle(probe).opacity) : 1;\n        if (op < 0.9) settle();\n      }, 1600);\n    };\n    setup();\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
